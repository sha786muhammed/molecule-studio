name: Validate local workbench
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
      - run: npm run build
      - run: npm test
      - run: npm run test:sites
      - name: Verify the local launcher and scientific examples
        run: python scripts/smoke_local.py --output "$RUNNER_TEMP/studio-example-results"
      - name: Build the free demo container
        run: docker build -t molecule-studio:ci .
      - name: Verify the hosted frontend and scientific backend within 512 MB
        run: |
          docker run -d --name studio-demo --memory=512m --cpus=0.1 -p 127.0.0.1:10000:10000 molecule-studio:ci
          trap 'docker logs studio-demo; docker rm -f studio-demo' EXIT
          python scripts/smoke_hosted.py
