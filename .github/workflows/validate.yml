name: Validate local workbench
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
      - run: npm run build
      - run: npm test
      - run: npm run test:sites
      - name: Verify the local launcher and scientific examples
        run: python scripts/smoke_local.py --output "$RUNNER_TEMP/studio-example-results"
